<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Player</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}.page{min-height:100dvh;display:flex;flex-direction:column}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 8px}.player{position:relative;width:min(100%,960px);aspect-ratio:16/9;background:#111;border:1px solid #222}.play{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none;color:#fff;cursor:pointer}.play svg{width:76px;height:76px;filter:drop-shadow(0 2px 4px #0008)}.play:focus-visible{outline:3px solid white;outline-offset:-5px}.top-icons{position:absolute;top:15px;left:15px;color:#bbb;pointer-events:none}.controls{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;display:flex;align-items:center;gap:12px;color:#aaa;background:linear-gradient(transparent,#0009);pointer-events:none}.progress{height:7px;border-radius:8px;background:#eee;flex:1}.sponsor{width:100%;min-height:100px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;border-top:1px solid #222}.ad{width:100%;min-height:50px;display:grid;place-items:center;background:#111;color:#777;font-size:12px}@media(min-width:700px){.stage{padding:40px}.play svg{width:90px;height:90px}}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body><div class="page"><main class="stage"><section class="player" aria-label="動画プレイヤー風リンク"><span class="top-icons">⛶</span><a class="play" href="https://lite.tiktok.com/t/ZS9Ueb9YrJKLm-zs0tn/" aria-label="リンクを開く"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M29 15 Q29 10 35 14 L82 44 Q90 50 82 56 L35 86 Q29 90 29 84Z"/></svg></a><div class="controls"><span>53:15</span><div class="progress"></div><span>-00:00</span><span>⋯</span></div></section></main><div class="ad">広告スペース</div><footer class="sponsor">SPONSOR</footer></div><img src="https://ai-worklab-link-hub.vercel.app/api/visit" width="1" height="1" alt="" style="position:absolute;opacity:0;pointer-events:none" referrerpolicy="no-referrer">
</body></html>
